name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'thinkling-org/thinkling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Create the draft once, so the parallel builds upload into the same release.
      - name: Create draft release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build installer and upload to the draft release
        run: npm run desktop:release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Smoke test the packaged updater
        run: npm run test:desktop-updates
      - name: Test real installer launch and update restart
        run: npm run test:installer-lifecycle
      - name: Keep installer and update metadata for verification
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Intel and Apple Silicon apps and upload to the draft release
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            # Signed with a Developer ID; electron-builder notarizes when the APPLE_API_* variables are set.
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            if [ -n "$APPLE_API_KEY_BASE64" ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
            fi
            npm run desktop:release:mac
          else
            # Without a certificate, sign ad hoc: Apple Silicon refuses to run unsigned apps at all.
            npm run build
            npx electron-builder --mac --x64 --arm64 --publish always -c.mac.identity=-
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build AppImage and .deb and upload to the draft release
        run: npm run desktop:release:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-${{ github.ref_name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
